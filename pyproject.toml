[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "evalnoise"
version = "0.1.0"
description = "Paired uncertainty analysis for per-item binary model evaluations"
requires-python = ">=3.12"
dependencies = ["numpy==2.5.4"]

[project.scripts]
evalnoise = "evalnoise.cli:main"

[dependency-groups]
dev = ["pytest==9.0.3", "pip-audit==2.10.0", "matplotlib==3.10.8", "ruff==0.14.14"]
modal = ["modal==1.6.2", "python-dotenv==1.2.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = [".uv-cache", ".venv-bfcl", "results", "dist"]
